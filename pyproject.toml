[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nodestro-session"
dynamic = ["version"]
description = "Protection of a single-user app that serves HTTP on loopback: launch tokens, sessions, CSRF, Host and Origin checks."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Peter Karlhuber" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# Standard library only: the package defines the ASGI types it uses itself.
dependencies = []

[project.optional-dependencies]
dev = [
    # The tests run the middleware in a Starlette app with its test client; Starlette 1.x prefers httpx2 over httpx.
    "starlette>=1.0",
    "httpx2>=2.16",
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/peterkarlhuber/nodestro-session"

[tool.hatch.version]
path = "src/nodestro_session/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nodestro_session"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert and use fixed example secrets.
"tests/**" = ["S101", "S103", "S104", "S105", "S106", "S603", "S607", "S108"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["nodestro_session"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
